<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBook — Event Booking Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS CDN & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .welcome-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        .brand-icon {
            background-color: #4f46e5;
            color: #ffffff;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .btn-primary-custom {
            background-color: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
            font-weight: 500;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            transition: background-color 0.15s ease;
        }

        .btn-primary-custom:hover {
            background-color: #4338ca;
            border-color: #4338ca;
            color: #ffffff;
        }

        .footer-text {
            color: #94a3b8;
            font-size: 0.8125rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="brand-icon">
            <i class="bi bi-ticket-detailed-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">QuickBook</h3>
        <p class="text-secondary small fw-medium mb-3">Event Booking Platform</p>
        <p class="text-muted small mb-4">
            A centralized platform for event management, ticket reservations, and referral network tracking.
        </p>

        <a href="{% url 'dashboard-login' %}" class="btn btn-primary-custom shadow-sm">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Staff Login</span>
        </a>
    </div>

    <div class="footer-text">
        QuickBook
    </div>

</body>
</html>
